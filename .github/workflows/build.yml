name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wishlist_tests
          POSTGRES_USER: wishlist_tests
          POSTGRES_PASSWORD: wishlist_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist_tests -d wishlist_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WISHLIST_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/wishlist_tests?user=wishlist_tests&password=wishlist_tests
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Build with Gradle
        run: ./gradlew build
      - name: Install Chromium system dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libcups2 libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6 libxkbcommon0
      - name: Run served Web browser tests
        run: ./gradlew browserTest
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: browserTests/build/artifacts/**
